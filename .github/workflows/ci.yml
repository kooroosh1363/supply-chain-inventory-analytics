name: Supply Chain Analytics CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run unit and integration tests
        run: python -m pytest --quiet
      - name: Run deterministic offline pipeline
        run: python -m src.run_analysis --input tests/fixtures/sku_sample.csv --output-dir outputs
      - name: Validate deliverables
        run: |
          test -s outputs/data_quality_summary.csv
          test -s outputs/executive_summary.csv
          test -s outputs/abc_sku_prioritization.csv
          test -s outputs/velocity_segments.csv
          test -s outputs/shelf_life_risk.csv
          test -s outputs/handling_profile.csv

