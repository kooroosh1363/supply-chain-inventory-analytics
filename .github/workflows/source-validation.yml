name: Official UCI Source Validation

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Download and validate official source
        run: python -m src.download_data
      - name: Execute full pipeline
        run: python -m src.run_analysis
      - name: Validate output set
        run: test -s outputs/data_quality_summary.csv && test -s outputs/executive_summary.csv

